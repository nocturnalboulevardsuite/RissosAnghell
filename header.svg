<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Creepster&amp;family=VT323&amp;display=swap');
      
      .bg { fill: #000; }
      
      @keyframes flashExtreme {
        0% { opacity: 1; fill: #ff0000; }
        25% { opacity: 0; }
        50% { opacity: 1; fill: #880000; }
        75% { opacity: 0.1; }
        100% { opacity: 1; fill: #ff0000; }
      }
      
      @keyframes flashStroke {
        0% { stroke: #ff0000; opacity: 1; }
        30% { stroke: #550000; opacity: 0.2; }
        60% { stroke: #ff0000; opacity: 1; }
        100% { stroke: #aa0000; opacity: 0.5; }
      }

      @keyframes bgFlash {
        0%, 100% { fill: #000; }
        50% { fill: #220000; }
        75% { fill: #ff0000; }
        85% { fill: #000; }
      }
      
      @keyframes glitchText {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-3px, 2px); }
        40% { transform: translate(3px, -2px); }
        60% { transform: translate(-2px, 3px); }
        80% { transform: translate(2px, -3px); }
        100% { transform: translate(0, 0); }
      }

      /* WARNING OVERLAY ANIMATIONS */
      @keyframes warningFlashFast {
        0%, 100% { opacity: 0.9; }
        20% { opacity: 0; }
        40% { opacity: 0.7; }
        60% { opacity: 0; }
        80% { opacity: 1; }
      }
      @keyframes warningFlashSlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 0.1; }
      }
      
      .matrix { font-family: 'VT323', monospace; font-size: 18px; animation: flashExtreme 0.1s infinite; }
      .matrix2 { font-family: 'VT323', monospace; font-size: 20px; animation: flashExtreme 0.08s infinite reverse; }
      
      .title { font-family: 'Creepster', cursive; font-size: 85px; fill: #ff0000; text-anchor: middle; filter: drop-shadow(0 0 15px #ff0000); animation: glitchText 0.2s infinite, flashExtreme 0.15s infinite; }
      .subtitle { font-family: 'Creepster', cursive; font-size: 45px; fill: #aa0000; text-anchor: middle; animation: flashExtreme 0.12s infinite; }
      .blood { fill: #ff0000; animation: flashExtreme 0.2s infinite; }
      
      .neon { fill: none; stroke-width: 4; filter: drop-shadow(0 0 10px #ff0000); animation: flashStroke 0.09s infinite; }
      .neon-solid { animation: flashExtreme 0.1s infinite; }
      
      /* OVERLAY TEXT STYLES */
      .warning-text { font-family: 'VT323', monospace; font-size: 45px; fill: #ff0000; text-anchor: middle; filter: drop-shadow(0 0 8px #ff0000); }
      .w-fast { animation: warningFlashFast 0.25s infinite; }
      .w-slow { animation: warningFlashSlow 0.4s infinite reverse; }
      .w-huge { font-size: 130px; font-weight: bold; opacity: 0.4; }
    </style>
    
    <pattern id="matrix-bg" width="120" height="100" patternUnits="userSpaceOnUse">
      <text x="0" y="20" class="matrix">0101 1101 M4TR1X</text>
      <text x="0" y="40" class="matrix2">BL00D ERR0R SYS</text>
      <text x="0" y="60" class="matrix">D34TH H3LL 000</text>
      <text x="0" y="80" class="matrix2">666 010101 666</text>
      <text x="0" y="100" class="matrix">SANGRE 0101 ERROR</text>
    </pattern>
  </defs>

  <!-- Flashing Background -->
  <rect width="100%" height="100%" style="animation: bgFlash 0.3s infinite;" />
  <rect width="100%" height="100%" fill="url(#matrix-bg)" />

  <!-- Perspective Grid -->
  <g>
    <path d="M 0 450 L 450 180 L 550 180 L 1000 450 Z" fill="#0a0000" />
    <line x1="500" y1="180" x2="500" y2="450" class="neon" />
    <line x1="500" y1="180" x2="150" y2="450" class="neon" />
    <line x1="500" y1="180" x2="850" y2="450" class="neon" />
    <line x1="500" y1="180" x2="-200" y2="450" class="neon" />
    <line x1="500" y1="180" x2="1200" y2="450" class="neon" />
    
    <line x1="380" y1="220" x2="620" y2="220" class="neon" stroke-width="1" />
    <line x1="250" y1="280" x2="750" y2="280" class="neon" stroke-width="2" />
    <line x1="50" y1="360" x2="950" y2="360" class="neon" stroke-width="3" />
  </g>

  <!-- Tron Ares Motorcycle (Vertical Perspective) -->
  <g transform="translate(500, 320)">
    <rect x="-45" y="-35" width="90" height="70" rx="15" fill="#050000" stroke="#ff0000" stroke-width="5" class="neon-solid" filter="drop-shadow(0 0 10px #ff0000)"/>
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="#110000" stroke="#aa0000" stroke-width="3" class="neon-solid"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#ff0000" stroke-width="3" class="neon" />
    
    <path d="M -25 -35 L -35 -85 L -10 -110 L 10 -110 L 35 -85 L 25 -35 Z" fill="#000" stroke="#ff0000" stroke-width="4" class="neon-solid" />
    <rect x="-20" y="-80" width="40" height="10" fill="#ff0000" class="neon-solid" filter="drop-shadow(0 0 20px #ff0000)"/>
    <rect x="-10" y="-105" width="20" height="15" fill="#ff0000" class="neon-solid"/>
    
    <path d="M -40 35 L -80 150 L 80 150 L 40 35 Z" fill="#ff0000" opacity="0.3" filter="drop-shadow(0 0 25px #ff0000)" class="neon-solid" />
    <line x1="-40" y1="35" x2="-80" y2="150" stroke="#ff0000" stroke-width="6" class="neon" />
    <line x1="40" y1="35" x2="80" y2="150" stroke="#ff0000" stroke-width="6" class="neon" />
  </g>

  <!-- Dripping Blood Text -->
  <g transform="translate(500, 110)">
    <text x="0" y="0" class="title">El Rincón del Rissos</text>
    <text x="0" y="55" class="subtitle">'Anghell Collection'</text>
    
    <path d="M -300 15 Q -290 60 -300 80 Q -310 60 -300 15" class="blood" />
    <path d="M -150 15 Q -140 90 -150 120 Q -160 90 -150 15" class="blood" />
    <path d="M -20 15 Q -10 140 -20 180 Q -30 140 -20 15" class="blood" />
    <path d="M 80 15 Q 90 70 80 100 Q 70 70 80 15" class="blood" />
    <path d="M 220 15 Q 230 110 220 140 Q 210 110 220 15" class="blood" />
    <path d="M 330 15 Q 335 45 330 65 Q 325 45 330 15" class="blood" />
  </g>

  <!-- ERRORS, ACCESS DENIED, SCATTERED OVERLAY TEXTS -->
  <g class="warning-text">
    <!-- Huge background fatal error -->
    <text x="500" y="280" class="w-huge w-fast">FATAL ERROR</text>
    
    <!-- Medium floating warnings -->
    <text x="180" y="250" class="w-fast" transform="rotate(-15 180 250)">ACCESS DENIED</text>
    <text x="820" y="150" class="w-slow" transform="rotate(10 820 150)">ERROR 404</text>
    <text x="150" y="380" class="w-slow" transform="rotate(5 150 380)">RISSOS_SYS</text>
    <text x="850" y="350" class="w-fast" transform="rotate(-20 850 350)">ANGHELL_ERR</text>
    
    <!-- Smaller scattered errors -->
    <text x="300" y="80" class="w-fast" style="font-size: 24px;">SYSTEM FAILURE</text>
    <text x="700" y="90" class="w-slow" style="font-size: 24px;">BLOOD_OVERFLOW</text>
    <text x="350" y="420" class="w-fast" style="font-size: 28px;">RISSOS</text>
    <text x="650" y="420" class="w-slow" style="font-size: 28px;">ANGHELL</text>
  </g>
</svg>
